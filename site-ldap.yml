# Bilag H: Authentik LDAP-outpost
# Kørsel: ansible-playbook site-ldap.yml
#
# Forudsætning: site-apps.yml skal være kørt først, så authentik-stakken
# er oppe med blueprints-mappen mountet i worker-containeren.
- name: Konfigurér Authentik LDAP-outpost
  hosts: server
  become: true
  roles:
    - authentik_ldap
