---
# ──────────────────────────────────────────────
# LDAP-service adgangskode (genereres én gang)
# ──────────────────────────────────────────────
- name: Tjek om ldapservice-adgangskode allerede er genereret
  ansible.builtin.stat:
    path: "{{ authentik_dir }}/ldap_service_pass"
  register: ldap_pass_stat

- name: Generér ldapservice-adgangskode og gem den
  ansible.builtin.shell:
    cmd: "openssl rand -base64 32 | tr -d '\\n=/+' | head -c 32 > {{ authentik_dir }}/ldap_service_pass"
  when: not ldap_pass_stat.stat.exists
  no_log: true
  changed_when: true

- name: Sæt filrettigheder på adgangskode-filen
  ansible.builtin.file:
    path: "{{ authentik_dir }}/ldap_service_pass"
    mode: "0600"
    owner: root
    group: root

- name: Hent ldapservice-adgangskode
  ansible.builtin.slurp:
    src: "{{ authentik_dir }}/ldap_service_pass"
  register: _ldap_pass_raw
  no_log: true

- name: Sæt ldapservice-adgangskode som fact
  ansible.builtin.set_fact:
    _ldap_svc_pass: "{{ _ldap_pass_raw.content | b64decode | trim }}"
  no_log: true

# ──────────────────────────────────────────────
# INJECT ADGANGSKODE I WORKER-MILJØ
# ──────────────────────────────────────────────
- name: Tilføj AUTHENTIK_LDAP_SVC_PASS til .env (kun hvis ikke der)
  ansible.builtin.lineinfile:
    path: "{{ authentik_dir }}/.env"
    regexp: '^AUTHENTIK_LDAP_SVC_PASS='
    line: "AUTHENTIK_LDAP_SVC_PASS={{ _ldap_svc_pass }}"
  no_log: true
  register: _env_updated

# ──────────────────────────────────────────────
# BLUEPRINT
# ──────────────────────────────────────────────
- name: Opret blueprints-mappe
  ansible.builtin.file:
    path: "{{ authentik_dir }}/blueprints"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Læg LDAP-blueprint ud
  ansible.builtin.template:
    src: ldap-blueprint.yaml.j2
    dest: "{{ authentik_dir }}/blueprints/ldap-setup.yaml"
    owner: root
    group: root
    mode: "0644"
  register: _blueprint_changed

# ──────────────────────────────────────────────
# WORKER-RESTART VED ÆNDRINGER
# env-ændring kræver container-genskabelse (nye env-vars);
# blueprint-ændring kræver blot restart for at genscanne /blueprints/custom/.
# ──────────────────────────────────────────────
- name: Genskab Authentik worker (ny env-variabel)
  ansible.builtin.command:
    cmd: docker compose up -d --no-deps worker
    chdir: "{{ authentik_dir }}"
  when: _env_updated.changed
  changed_when: true

- name: Genstart Authentik worker (blueprint opdateret)
  ansible.builtin.command:
    cmd: docker compose restart worker
    chdir: "{{ authentik_dir }}"
  when: _blueprint_changed.changed and not _env_updated.changed
  changed_when: true

# ──────────────────────────────────────────────
# VENT PÅ OUTPOST-CONTAINER
# ──────────────────────────────────────────────
- name: Vent på at Authentik worker starter outpost-containeren (op til 5 minutter)
  ansible.builtin.command:
    cmd: "docker ps --filter name={{ authentik_outpost_container }} --filter status=running"
  register: _outpost_ps
  until: authentik_outpost_container in _outpost_ps.stdout
  retries: 30
  delay: 10
  changed_when: false

# ──────────────────────────────────────────────
# PROXY-NET VERIFICERING OG TILKNYTNING
# ──────────────────────────────────────────────
- name: Tjek hvilke netværk outpost-containeren er på
  ansible.builtin.command:
    cmd: "docker inspect {{ authentik_outpost_container }}"
  register: _outpost_inspect
  changed_when: false

- name: Tilknyt outpost-containeren til proxy-net (hvis ikke allerede tilknyttet)
  ansible.builtin.command:
    cmd: "docker network connect proxy-net {{ authentik_outpost_container }}"
  when: "'proxy-net' not in _outpost_inspect.stdout"
  changed_when: true

# ──────────────────────────────────────────────
# LDAP VERIFICERING
# ──────────────────────────────────────────────
- name: Verificér LDAP-bind og full directory search
  ansible.builtin.shell:
    cmd: |
      docker run --rm --network proxy-net alpine sh -c \
        "apk add openldap-clients > /dev/null 2>&1 && \
         ldapsearch -x \
           -H ldap://{{ authentik_outpost_container }}:{{ authentik_ldap_port }} \
           -D 'cn=ldapservice,ou=users,{{ authentik_ldap_base_dn }}' \
           -w '{{ _ldap_svc_pass }}' \
           -b '{{ authentik_ldap_base_dn }}' \
           '(objectClass=user)' cn"
  register: _ldap_result
  no_log: true
  changed_when: false
  retries: 6
  delay: 10
  until: _ldap_result.rc == 0

- name: Bekræft at ldapsearch returnerede mindst 2 brugere (akadmin + ldapservice)
  ansible.builtin.assert:
    that: _ldap_result.stdout_lines | select('match', '^cn:') | list | length >= 2
    fail_msg: >
      LDAP-search returnerede for få brugere.
      Tjek at search_full_ldap_directory-permissionen er tildelt ldap-search rollen
      via objectpermission-indgangen i blueprintet.
    success_msg: "LDAP-outpost kørende — full directory search virker."

- name: Vis fundne LDAP-brugere
  ansible.builtin.debug:
    msg: "{{ _ldap_result.stdout_lines | select('match', '^(dn|cn):') | list }}"

- name: Vis ldapservice-adgangskode (til brug i Mailcow og Nextcloud)
  ansible.builtin.debug:
    msg: >
      ldapservice-adgangskode er gemt i {{ authentik_dir }}/ldap_service_pass
      på serveren. Brug denne i Mailcow og Nextcloud LDAP-konfiguration.
