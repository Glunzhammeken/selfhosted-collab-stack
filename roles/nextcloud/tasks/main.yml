---
# Projektmappe
- name: Opret Nextcloud-projektmappe
  ansible.builtin.file:
    path: "{{ nextcloud_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# compose.yaml
- name: Læg compose.yaml ud fra skabelon
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ nextcloud_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

# Start master-container
- name: Tjek om Nextcloud AIO master-container allerede kører
  ansible.builtin.command:
    cmd: docker compose ps --quiet nextcloud-aio-mastercontainer
    chdir: "{{ nextcloud_dir }}"
  register: nextcloud_running
  changed_when: false
  failed_when: false

- name: Træk Nextcloud AIO-image (kun ved første opstart)
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ nextcloud_dir }}"
  when: nextcloud_running.stdout == ''
  changed_when: true

- name: Start Nextcloud AIO master-container
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ nextcloud_dir }}"
  changed_when: false

- name: Vent på at AIO-grænsefladen er klar på port 8080
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8080
    timeout: 60

# Manuel AIO-opsætning (kun ved første kørsel)
- name: Tjek om AIO-opsætning allerede er gennemført
  ansible.builtin.command: docker inspect nextcloud-aio-apache
  register: aio_apache_stat
  changed_when: false
  failed_when: false

- name: Vent på manuel AIO-opsætning via SSH-tunnel
  ansible.builtin.pause:
    prompt: |

      ════════════════════════════════════════════════════════
      MANUEL HANDLING PÅKRÆVET — tryk Enter når du er færdig
      ════════════════════════════════════════════════════════

      Åbn SSH-tunnel fra din lokale maskine:
        ssh -L 8080:localhost:8080 root@<server-ip>

      Gå til: https://localhost:8080

        1. Notér passphrasen — den kan ikke gendannes
        2. Klik "Open Nextcloud AIO login"
        3. Indtast domænet: {{ nextcloud_domain }}
        4. Vælg containere: Talk, Collabora, ClamAV
        5. Klik "Download and start containers"
        6. Vent til alle containere viser grønt i AIO-grænsefladen

      ════════════════════════════════════════════════════════
  when: aio_apache_stat.rc != 0

- name: Vent på at nextcloud-aio-apache er tilgængelig (op til 10 minutter)
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 11000
    timeout: 600
    delay: 5
  when: aio_apache_stat.rc != 0

# Nginx vhost — deployes efter apache-containeren eksisterer
- name: Læg Nginx vhost for Nextcloud ud
  ansible.builtin.template:
    src: cloud.conf.j2
    dest: "{{ nginx_proxy_dir }}/conf.d/cloud.conf"
    owner: root
    group: root
    mode: "0644"
  register: cloud_vhost

# Alle tre domæner har nu egne vhosts — bootstrap-filen fjernes
- name: Fjern 00-bootstrap.conf (alle domæner har egne vhosts)
  ansible.builtin.file:
    path: "{{ nginx_proxy_dir }}/conf.d/00-bootstrap.conf"
    state: absent
  register: bootstrap_removed

- name: Genindlæs Nginx efter vhost-ændringer
  ansible.builtin.command:
    cmd: docker compose exec nginx nginx -s reload
    chdir: "{{ nginx_proxy_dir }}"
  when: cloud_vhost.changed or bootstrap_removed.changed
  changed_when: true

# Verifikation
- name: Bekræft at Nextcloud AIO master-container kører
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ nextcloud_dir }}"
  register: nextcloud_ps
  changed_when: false

- name: Bekræft at master-containeren er oppe
  ansible.builtin.assert:
    that:
      - "'nextcloud-aio-mastercontainer' in nextcloud_ps.stdout"
    success_msg: "Nextcloud AIO master-container kører."
    fail_msg: "ADVARSEL: Nextcloud AIO master-container kører ikke."

- name: Vent på at nextcloud-aio-apache er klar på port 11000
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 11000
    timeout: 120
    delay: 5

- name: Verificér at Nextcloud er tilgængeligt via HTTPS
  ansible.builtin.uri:
    url: "https://{{ nextcloud_domain }}"
    status_code: [200, 302]
    validate_certs: true
  register: nextcloud_https_check
  retries: 12
  delay: 10
  until: nextcloud_https_check.status in [200, 302]
  changed_when: false
