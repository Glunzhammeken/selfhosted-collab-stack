---
# ──────────────────────────────────────────────
# MAILCOW API-NØGLE
# Ved første kørsel: pause + prompt så bruger kan paste nøglen.
# Efterfølgende kørsler: læs fra fil.
# ──────────────────────────────────────────────
- name: Tjek om Mailcow API-nøgle allerede er gemt
  ansible.builtin.stat:
    path: "{{ mailcow_api_key_file }}"
  register: _api_key_stat

- name: Prompt for Mailcow API-nøgle (kun første gang)
  ansible.builtin.pause:
    prompt: |

      ════════════════════════════════════════════════════════════════
      MAILCOW API-NØGLE PÅKRÆVET

      1. Åbn:    {{ mailcow_api_base_url }}
      2. Gå til: Configuration → Access → API
      3. Klik:   "Generate API key" (admin, read-write)
      4. Kopiér nøglen og paste den her, tryk Enter:
      ════════════════════════════════════════════════════════════════
  register: _api_key_input
  when: not _api_key_stat.stat.exists
  no_log: true

- name: Gem Mailcow API-nøgle i fil
  ansible.builtin.copy:
    content: "{{ _api_key_input.user_input | trim }}"
    dest: "{{ mailcow_api_key_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not _api_key_stat.stat.exists
  no_log: true

- name: Slurp Mailcow API-nøgle fra fil
  ansible.builtin.slurp:
    src: "{{ mailcow_api_key_file }}"
  register: _api_key_raw
  no_log: true

- name: Sæt API-nøgle som fact
  ansible.builtin.set_fact:
    _mailcow_api_key: "{{ _api_key_raw.content | b64decode | trim }}"
  no_log: true

# ──────────────────────────────────────────────
# HENT LDAPSERVICE-ADGANGSKODE FRA AUTHENTIK
# ──────────────────────────────────────────────
- name: Slurp ldapservice-adgangskode fra authentik-rolle
  ansible.builtin.slurp:
    src: "{{ authentik_dir }}/ldap_service_pass"
  register: _ldap_pass_raw
  no_log: true

- name: Sæt ldapservice-adgangskode som fact
  ansible.builtin.set_fact:
    _ldap_bind_password: "{{ _ldap_pass_raw.content | b64decode | trim }}"
  no_log: true

# ──────────────────────────────────────────────
# OPRET MAIL-DOMÆNE I MAILCOW
# Idempotent: GET først, POST kun hvis ikke findes
# ──────────────────────────────────────────────
- name: Tjek om mail-domænet allerede findes
  ansible.builtin.uri:
    url: "{{ mailcow_api_base_url }}/api/v1/get/domain/{{ mailcow_ldap_mail_domain }}"
    method: GET
    headers:
      X-API-Key: "{{ _mailcow_api_key }}"
      Content-Type: application/json
    return_content: true
    status_code: [200]
    validate_certs: true
  register: _domain_check
  changed_when: false

- name: Opret mail-domænet via API
  ansible.builtin.uri:
    url: "{{ mailcow_api_base_url }}/api/v1/add/domain"
    method: POST
    headers:
      X-API-Key: "{{ _mailcow_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      domain: "{{ mailcow_ldap_mail_domain }}"
      description: "{{ mailcow_ldap_mail_domain_description }}"
      active: 1
      restart_sogo: 1
    status_code: [200]
    validate_certs: true
  when: _domain_check.json | length == 0
  register: _domain_create
  changed_when: _domain_create.status == 200

# ──────────────────────────────────────────────
# DKIM — hent og udskriv så brugeren kan tilføje i DNS
# ──────────────────────────────────────────────
- name: Hent DKIM-record fra Mailcow
  ansible.builtin.uri:
    url: "{{ mailcow_api_base_url }}/api/v1/get/dkim/{{ mailcow_ldap_mail_domain }}"
    method: GET
    headers:
      X-API-Key: "{{ _mailcow_api_key }}"
    return_content: true
    status_code: [200]
    validate_certs: true
  register: _dkim_record
  changed_when: false

- name: Vis DKIM-record til DNS-konfiguration
  ansible.builtin.debug:
    msg: |
      ════════════════════════════════════════════════════════════════
      DKIM TXT-record til DNS — tilføj denne hos din DNS-udbyder:
      Navn:  dkim._domainkey.{{ mailcow_ldap_mail_domain }}
      Type:  TXT
      Værdi: {{ _dkim_record.json.dkim_txt | default(_dkim_record.json) }}
      ════════════════════════════════════════════════════════════════

- name: Verificér at DKIM-record er publiceret i DNS (advarsel hvis ikke)
  ansible.builtin.command:
    cmd: "dig +short TXT dkim._domainkey.{{ mailcow_ldap_mail_domain }}"
  register: _dkim_dig
  changed_when: false
  failed_when: false

- name: Advarsel hvis DKIM-record ikke fundet i DNS endnu
  ansible.builtin.debug:
    msg: >
      ADVARSEL: DKIM-record ikke fundet i DNS for {{ mailcow_ldap_mail_domain }}.
      Tilføj TXT-recorden ovenfor og kør playbook igen for at verificere.
  when: "'v=DKIM1' not in _dkim_dig.stdout"

# ──────────────────────────────────────────────
# VERIFICÉR LDAP-OUTPOST NÅS FRA MAILCOW-STAKKEN
# (kræver at php-fpm er på proxy-net — sat i roles/mailcow override)
# ──────────────────────────────────────────────
- name: Verificér at LDAP-outposten kan nås fra php-fpm-mailcow
  ansible.builtin.shell:
    cmd: |
      docker exec {{ mailcow_phpfpm_container }} sh -c \
        "apk add openldap-clients > /dev/null 2>&1 && \
         ldapsearch -x \
           -H ldap://{{ mailcow_ldap_host }}:{{ mailcow_ldap_port }} \
           -D '{{ mailcow_ldap_bind_dn }}' \
           -w '{{ _ldap_bind_password }}' \
           -b '{{ mailcow_ldap_base_dn }}' \
           '{{ mailcow_ldap_filter }}' cn"
  register: _ldap_reach
  changed_when: false
  retries: 3
  delay: 5
  until: _ldap_reach.rc == 0

- name: Bekræft at LDAP-search returnerede brugere
  ansible.builtin.assert:
    that: _ldap_reach.stdout_lines | select('match', '^cn:') | list | length >= 2
    fail_msg: >
      LDAP-search fra Mailcow-stakken returnerede for få brugere.
      Tjek at php-fpm-mailcow er på proxy-net og at testbrugerne findes i Authentik.
    success_msg: "LDAP-outpost nåbar fra Mailcow — bind og search virker."

# ──────────────────────────────────────────────
# KONFIGURÉR IDENTITY PROVIDER (LDAP) VIA API
# ──────────────────────────────────────────────
- name: Konfigurér LDAP som Identity Provider i Mailcow
  # Feltnavne matchet mod GET /api/v1/get/identity-provider:
  # basedn/binddn/bindpass (ingen underscore), default_template som streng,
  # login_provisioning som boolean. Ukendte felter ignoreres stille af API'et.
  ansible.builtin.uri:
    url: "{{ mailcow_api_base_url }}/api/v1/edit/identity-provider/ldap"
    method: POST
    headers:
      X-API-Key: "{{ _mailcow_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      authsource: "ldap"
      host: "{{ mailcow_ldap_host }}"
      port: "{{ mailcow_ldap_port | string }}"
      use_ssl: "{{ mailcow_ldap_use_ssl }}"
      use_tls: "{{ mailcow_ldap_use_tls }}"
      ignore_ssl_errors: false
      basedn: "{{ mailcow_ldap_base_dn }}"
      binddn: "{{ mailcow_ldap_bind_dn }}"
      bindpass: "{{ _ldap_bind_password }}"
      filter: "{{ mailcow_ldap_filter }}"
      attribute_field: "{{ mailcow_ldap_attribute_field }}"
      username_field: "{{ mailcow_ldap_username_field }}"
      default_template: "{{ mailcow_ldap_attribute_mapping }}"
      login_provisioning: true
      periodic_sync: "1"
      import_users: "1"
      sync_interval: "{{ mailcow_ldap_sync_interval | string }}"
      mappers: []
      templates: []
    status_code: [200]
    validate_certs: true
  register: _idp_config
  changed_when: _idp_config.status == 200

# ──────────────────────────────────────────────
# VERIFIKATION — IdP-config faktisk landet i Mailcow
# Auto-provisionering af mailbox sker først ved første rigtige SOGo/IMAP-
# login (Mailcows PHP-kode binder mod LDAP, opretter mailbox-række i SQL).
# Det er en runtime-egenskab — vi verificerer kun deploy-tid-konfigurationen.
# ──────────────────────────────────────────────
- name: Hent IdP-config tilbage fra Mailcow for at verificere
  ansible.builtin.uri:
    url: "{{ mailcow_api_base_url }}/api/v1/get/identity-provider"
    method: GET
    headers:
      X-API-Key: "{{ _mailcow_api_key }}"
    return_content: true
    status_code: [200]
    validate_certs: true
  register: _idp_verify
  changed_when: false

- name: Debug — vis IdP-config-respons
  ansible.builtin.debug:
    var: _idp_verify.json

- name: Vis næste skridt — manuel verifikation af auto-provisionering
  ansible.builtin.debug:
    msg: |
      ════════════════════════════════════════════════════════════════
      MAILCOW LDAP-INTEGRATION FÆRDIG KONFIGURERET

      Verificér end-to-end ved at logge ind som testbruger:
        URL:      {{ mailcow_api_base_url }}/SOGo/
        Bruger:   {{ mailcow_ldap_testusers[0] }}@{{ mailcow_ldap_mail_domain }}
        Password: {{ mailcow_ldap_testuser_password }}

      Mailboxen oprettes automatisk ved første login. Bekræft i:
        Mail Setup → Mailboxes  (Identity Provider skal stå som "LDAP")

      For IMAP-test:
        openssl s_client -connect {{ mailcow_api_base_url | regex_replace('^https?://', '') }}:993 -crlf
        a login {{ mailcow_ldap_testusers[0] }}@{{ mailcow_ldap_mail_domain }} {{ mailcow_ldap_testuser_password }}
      ════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────
# OPTIONAL: REVOKE API-NØGLE EFTER SUCCESFULD KØRSEL
# Mailcow har intet API-endpoint til at slette egen API-nøgle, så vi
# bruger DB DELETE direkte. Default slået fra så playbook kan re-køres.
# Aktivér med: -e mailcow_ldap_revoke_api_key=true når alt er bekræftet.
# ──────────────────────────────────────────────
- name: Læs DBROOT fra mailcow.conf (kun ved revoke)
  ansible.builtin.shell:
    cmd: "grep ^DBROOT= {{ mailcow_dir }}/mailcow.conf | cut -d= -f2-"
  register: _dbroot_revoke
  when: mailcow_ldap_revoke_api_key | bool
  changed_when: false

- name: Slet Mailcow API-nøgle fra DB
  ansible.builtin.command:
    cmd: >
      docker compose exec -T
      --env MYSQL_PWD={{ _dbroot_revoke.stdout | trim }}
      {{ mailcow_mariadb_service }}
      mysql -u root mailcow
      -e "DELETE FROM api WHERE api_key='{{ _mailcow_api_key }}';"
    chdir: "{{ mailcow_dir }}"
  when: mailcow_ldap_revoke_api_key | bool
  changed_when: true

- name: Slet lokal API-nøgle-fil efter revoke
  ansible.builtin.file:
    path: "{{ mailcow_api_key_file }}"
    state: absent
  when: mailcow_ldap_revoke_api_key | bool

- name: Påmindelse om API-nøgle hvis ikke revokeret automatisk
  ansible.builtin.debug:
    msg: |
      ════════════════════════════════════════════════════════════════
      API-nøgle er STADIG AKTIV i Mailcow og gemt i {{ mailcow_api_key_file }}.
      Slet manuelt: {{ mailcow_api_base_url }} → Configuration → Access → API
      Eller kør playbook igen med: -e mailcow_ldap_revoke_api_key=true
      ════════════════════════════════════════════════════════════════
  when: not (mailcow_ldap_revoke_api_key | bool)

- name: Bekræftelse efter revoke
  ansible.builtin.debug:
    msg: "Mailcow API-nøgle er fjernet fra DB og fil. Næste kørsel prompter for ny nøgle."
  when: mailcow_ldap_revoke_api_key | bool
