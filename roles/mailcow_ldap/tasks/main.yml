---
# Bilag I: Mailcow LDAP-integration
#
# Mailcows IdP-konfiguration, mail-domæne og DKIM håndteres manuelt i UI.
# Mailcow-API'et er sparsomt dokumenteret og /api/v1/edit/identity-provider/ldap
# accepterer ukendte felter stiltiende — derfor sker UI-arbejdet ved pause-
# prompts, og Ansible begrænser sig til det der IKKE er UI: hentning af
# ldapservice-password og LDAP-reachability-check fra php-fpm-containeren.

# ──────────────────────────────────────────────
# HENT LDAPSERVICE-ADGANGSKODE FRA AUTHENTIK-ROLLEN
# ──────────────────────────────────────────────
- name: Slurp ldapservice-adgangskode fra authentik-rolle
  ansible.builtin.slurp:
    src: "{{ authentik_dir }}/ldap_service_pass"
  register: _ldap_pass_raw
  no_log: true

- name: Sæt ldapservice-adgangskode som fact
  ansible.builtin.set_fact:
    _ldap_bind_password: "{{ _ldap_pass_raw.content | b64decode | trim }}"
  no_log: true

# ──────────────────────────────────────────────
# VERIFICÉR AT LDAP-OUTPOSTEN NÅS FRA MAILCOW-STAKKEN
# Fanger proxy-net-/bind-fejl før brugeren rammer UI's Connection Test.
# ──────────────────────────────────────────────
- name: Verificér at LDAP-outposten kan nås fra php-fpm-mailcow
  ansible.builtin.shell:
    cmd: |
      docker exec {{ mailcow_phpfpm_container }} sh -c \
        "apk add openldap-clients > /dev/null 2>&1 && \
         ldapsearch -x \
           -H ldap://{{ mailcow_ldap_host }}:{{ mailcow_ldap_port }} \
           -D '{{ mailcow_ldap_bind_dn }}' \
           -w '{{ _ldap_bind_password }}' \
           -b '{{ mailcow_ldap_base_dn }}' \
           '{{ mailcow_ldap_filter }}' cn"
  register: _ldap_reach
  changed_when: false
  retries: 3
  delay: 5
  until: _ldap_reach.rc == 0
  no_log: true

- name: Bekræft at LDAP-search returnerede brugere
  ansible.builtin.assert:
    that: _ldap_reach.stdout_lines | select('match', '^cn:') | list | length >= 2
    fail_msg: >
      LDAP-search fra Mailcow-stakken returnerede for få brugere.
      Tjek at php-fpm-mailcow er på proxy-net og at testbrugerne findes i Authentik.
    success_msg: "LDAP-outpost nåbar fra Mailcow — bind og search virker."

# ──────────────────────────────────────────────
# MANUEL UI-KONFIGURATION
# ──────────────────────────────────────────────
- name: Pause — opret mail-domæne i Mailcow UI
  ansible.builtin.pause:
    prompt: |

      ════════════════════════════════════════════════════════════════
      OPRET MAIL-DOMÆNE I MAILCOW

      1. Åbn:    {{ mailcow_ui_url }}
      2. Gå til: Mail Setup → Domains → Add domain
      3. Udfyld:
           Domain:      {{ mailcow_ldap_mail_domain }}
           Description: {{ mailcow_ldap_mail_domain_description }}
      4. Klik "Add domain and restart SOGo"
      5. Tryk Enter her for at fortsætte
      ════════════════════════════════════════════════════════════════

- name: Pause — hent DKIM og læg TXT-record ud i DNS
  ansible.builtin.pause:
    prompt: |

      ════════════════════════════════════════════════════════════════
      DKIM TXT-RECORD I DNS

      1. I Mail Setup → Domains: klik "dns" under Action på {{ mailcow_ldap_mail_domain }}
      2. Kopiér TXT-værdien for dkim._domainkey.{{ mailcow_ldap_mail_domain }}
      3. Hos DNS-udbyderen, opret TXT-record:
           Navn:  dkim._domainkey.{{ mailcow_ldap_mail_domain }}
           Type:  TXT
           Værdi: (værdien fra Mailcow)
      4. Vent på DNS-propagering, verificér med:
           dig +short TXT dkim._domainkey.{{ mailcow_ldap_mail_domain }}
         Forventet: streng der starter med v=DKIM1; k=rsa; p=...
      5. Tryk Enter her når TXT-recorden er publiceret
      ════════════════════════════════════════════════════════════════

- name: Pause — konfigurér Identity Provider (LDAP) i Mailcow UI
  ansible.builtin.pause:
    prompt: |

      ════════════════════════════════════════════════════════════════
      KONFIGURÉR IDENTITY PROVIDER (LDAP)

      1. Åbn:    {{ mailcow_ui_url }}
      2. Gå til: System → Configuration → Access → Identity Provider
      3. Vælg "LDAP" og udfyld:

         Host:               {{ mailcow_ldap_host }}
         Port:               {{ mailcow_ldap_port }}
         Use SSL:            slået fra
         Use TLS:            slået fra
         Base DN:            {{ mailcow_ldap_base_dn }}
         Username Field:     {{ mailcow_ldap_username_field }}
         Filter:             {{ mailcow_ldap_filter }}
         Bind DN:            {{ mailcow_ldap_bind_dn }}
         Bind Password:      kør på serveren:  cat {{ authentik_dir }}/ldap_service_pass
         Attribute Field:    {{ mailcow_ldap_attribute_field }}
         Attribute Mapping:  Attribute=default, Template=Default
         Periodic Full Sync: ✓
         Import Users:       ✓
         Sync interval:      {{ mailcow_ldap_sync_interval }}

      4. Klik Save, derefter Connection Test
         Forventet: "Connection successful"
      5. Tryk Enter her når konfigurationen er gemt
      ════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────
# E2E-VERIFIKATION (manuel — auto-provisionering sker først ved login)
# ──────────────────────────────────────────────
- name: Vis næste skridt — manuel E2E-verifikation
  ansible.builtin.debug:
    msg: |
      ════════════════════════════════════════════════════════════════
      MAILCOW LDAP-INTEGRATION KLAR — VERIFICÉR MANUELT

      1. SOGo-login (auto-provisionering):
           URL:      {{ mailcow_ui_url }}/SOGo/
           Brugere:  {% for u in mailcow_ldap_testusers %}{{ u }}@{{ mailcow_ldap_mail_domain }}{% if not loop.last %}, {% endif %}{% endfor %}

           Password: {{ mailcow_ldap_testuser_password }}
         Mailboxen oprettes ved første login.
         Bekræft i Mail Setup → Mailboxes — Identity Provider skal stå som "LDAP".

      2. IMAP-login (bekræfter mail-klient-autentificering):
           openssl s_client -connect {{ mailcow_ui_url | regex_replace('^https?://', '') }}:993 -crlf
           a login {{ mailcow_ldap_testusers[0] }}@{{ mailcow_ldap_mail_domain }} {{ mailcow_ldap_testuser_password }}
         Forventet: "a OK Logged in"
      ════════════════════════════════════════════════════════════════
